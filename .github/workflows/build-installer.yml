name: Build OBS Streamlink

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  OBS_VERSION: 32.2.1
  OBS_DEPS_VERSION: 2026-07-15
  PYTHON_VERSION: '3.8.10'

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-2022

    steps:

      # ============================================================
      # Checkout obs-streamlink
      # ============================================================

      - name: Checkout obs-streamlink
        uses: actions/checkout@v5
        with:
          submodules: recursive


      # ============================================================
      # Checkout exact OBS version
      # ============================================================

      - name: Checkout OBS Studio
        uses: actions/checkout@v5
        with:
          repository: obsproject/obs-studio
          ref: 32.2.1
          path: obs-studio
          submodules: recursive


      # ============================================================
      # Python 3.8
      #
      # obs-streamlink explicitly requires Python 3.8 and links
      # against python38.lib.
      # ============================================================

      - name: Install Python 3.8
        uses: actions/setup-python@v6
        with:
          python-version: '3.8.10'
          architecture: x64
          check-latest: true

      - name: Verify Python 3.8
        shell: pwsh
        run: |
          Write-Host "Python executable:"
          python -c "import sys; print(sys.executable)"

          Write-Host ""
          Write-Host "Python version:"
          python --version

          $python = python -c "import sys; print(sys.executable)"
          $prefix = python -c "import sys; print(sys.prefix)"

          Write-Host ""
          Write-Host "Python prefix:"
          Write-Host $prefix

          if (-not ($python -match '3\.8')) {
            throw "Python 3.8 was not selected."
          }

          # Find Python headers and library.
          $include = Join-Path $prefix "include"
          $lib = Join-Path $prefix "libs\python38.lib"

          Write-Host ""
          Write-Host "Python include:"
          Write-Host $include

          Write-Host ""
          Write-Host "Python library:"
          Write-Host $lib

          if (-not (Test-Path $include)) {
            throw "Python include directory was not found: $include"
          }

          if (-not (Test-Path $lib)) {
            throw "python38.lib was not found: $lib"
          }

          "PYTHON_ROOT=$prefix" >> $env:GITHUB_ENV
          "PYTHON_INCLUDE=$include" >> $env:GITHUB_ENV
          "PYTHON_LIBRARY=$lib" >> $env:GITHUB_ENV


      # ============================================================
      # Build tools
      # ============================================================

      - name: Install build tools
        shell: pwsh
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y --no-progress
          choco install 7zip -y --no-progress


      # ============================================================
      # Download exact OBS dependency package
      # ============================================================

      - name: Download OBS dependencies
        shell: pwsh
        run: |
          $url = "https://github.com/obsproject/obs-deps/releases/download/${{ env.OBS_DEPS_VERSION }}/windows-deps-${{ env.OBS_DEPS_VERSION }}-x64.zip"

          $zip = "${{ github.workspace }}\obs-deps.zip"
          $deps = "${{ github.workspace }}\obs-deps"

          Write-Host "Downloading:"
          Write-Host $url

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $zip

          if (-not (Test-Path $zip)) {
            throw "Failed to download OBS dependencies."
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $deps | Out-Null

          7z x $zip "-o$deps" -y

          Write-Host ""
          Write-Host "OBS dependency directory:"
          Get-ChildItem $deps -Force


      # ============================================================
      # Configure OBS
      # ============================================================

      - name: Configure OBS
        shell: pwsh
        run: |
          $obs = "${{ github.workspace }}\obs-studio"
          $deps = "${{ github.workspace }}\obs-deps"
          $build = "$obs\build_x64"

          cmake `
            -S "$obs" `
            -B "$build" `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_PREFIX_PATH="$deps" `
            -DENABLE_UI=OFF `
            -DENABLE_BROWSER=OFF `
            -DENABLE_PLUGINS=OFF `
            -DENABLE_SCRIPTING=OFF `
            -DENABLE_WEBSOCKET=OFF `
            -DENABLE_VIRTUALCAM=OFF `
            -DENABLE_NEW_MPEGTS_OUTPUT=OFF


      # ============================================================
      # Build OBS libraries
      # ============================================================

      - name: Build OBS libraries
        shell: pwsh
        run: |
          $build = "${{ github.workspace }}\obs-studio\build_x64"

          cmake `
            --build "$build" `
            --config Release `
            --parallel `
            --target libobs obs-frontend-api


      # ============================================================
      # Locate OBS libraries
      # ============================================================

      - name: Locate OBS libraries
        shell: pwsh
        run: |
          $build = "${{ github.workspace }}\obs-studio\build_x64"

          $obsLib = Get-ChildItem `
            "$build" `
            -Recurse `
            -Filter "obs.lib" `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -match "\\Release\\"
            } |
            Select-Object -First 1

          if (-not $obsLib) {
            throw "Could not find obs.lib"
          }

          $frontendLib = Get-ChildItem `
            "$build" `
            -Recurse `
            -Filter "obs-frontend-api.lib" `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -match "\\Release\\"
            } |
            Select-Object -First 1

          if (-not $frontendLib) {
            throw "Could not find obs-frontend-api.lib"
          }

          Write-Host "obs.lib:"
          Write-Host $obsLib.FullName

          Write-Host ""
          Write-Host "obs-frontend-api.lib:"
          Write-Host $frontendLib.FullName

          "OBS_LIB_DIR=$($obsLib.Directory.FullName)" >> $env:GITHUB_ENV
          "OBS_FRONTEND_LIB_DIR=$($frontendLib.Directory.FullName)" >> $env:GITHUB_ENV


      # ============================================================
      # Configure plugin
      # ============================================================

      - name: Configure obs-streamlink
        shell: pwsh
        run: |
          $deps = "${{ github.workspace }}\obs-deps"
          $obs = "${{ github.workspace }}\obs-studio\build_x64"

          Write-Host "========================================"
          Write-Host "Python"
          Write-Host "========================================"
          Write-Host "Root:    $env:PYTHON_ROOT"
          Write-Host "Include: $env:PYTHON_INCLUDE"
          Write-Host "Library: $env:PYTHON_LIBRARY"

          Write-Host ""
          Write-Host "========================================"
          Write-Host "OBS"
          Write-Host "========================================"
          Write-Host "Build: $obs"
          Write-Host "Library: $env:OBS_LIB_DIR"
          Write-Host "Frontend: $env:OBS_FRONTEND_LIB_DIR"

          Write-Host ""
          Write-Host "========================================"
          Write-Host "FFmpeg"
          Write-Host "========================================"
          Write-Host "Path: $deps"

          cmake `
            -S . `
            -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DobsPath="$obs" `
            -DFFMPEG_PATH="$deps" `
            -DCMAKE_PREFIX_PATH="$deps" `
            -DPython3_ROOT_DIR="$env:PYTHON_ROOT" `
            -DPython3_EXECUTABLE="$env:PYTHON_ROOT\python.exe" `
            -DPython3_INCLUDE_DIR="$env:PYTHON_INCLUDE" `
            -DPython3_LIBRARY="$env:PYTHON_LIBRARY" `
            -DPython3_FIND_REGISTRY=NEVER `
            -DPython3_FIND_STRATEGY=LOCATION


      # ============================================================
      # Build plugin
      # ============================================================

      - name: Build obs-streamlink
        shell: pwsh
        run: |
          cmake `
            --build build `
            --config Release `
            --parallel


      # ============================================================
      # Verify DLL
      # ============================================================

      - name: Verify plugin
        shell: pwsh
        run: |
          $dll = Get-ChildItem `
            "${{ github.workspace }}\build" `
            -Recurse `
            -Filter "obs-streamlink.dll" `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -match "\\Release\\"
            } |
            Select-Object -First 1

          if (-not $dll) {
            Write-Host "Build output:"
            Get-ChildItem `
              "${{ github.workspace }}\build" `
              -Recurse `
              -Force

            throw "obs-streamlink.dll was not produced."
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "BUILD SUCCESSFUL"
          Write-Host "========================================"
          Write-Host $dll.FullName

          "PLUGIN_DLL=$($dll.FullName)" >> $env:GITHUB_ENV


      # ============================================================
      # Package
      # ============================================================

      - name: Package plugin
        shell: pwsh
        run: |
          $stage = "${{ github.workspace }}\package"
          $zip = "${{ github.workspace }}\obs-streamlink-obs32.2.1-windows-x64.zip"

          Remove-Item `
            $stage `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item `
            $zip `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$stage\obs-plugins\64bit" |
            Out-Null

          Copy-Item `
            "$env:PLUGIN_DLL" `
            "$stage\obs-plugins\64bit\obs-streamlink.dll" `
            -Force

          if (Test-Path "${{ github.workspace }}\data") {
            New-Item `
              -ItemType Directory `
              -Force `
              -Path "$stage\data\obs-plugins\obs-streamlink" |
              Out-Null

            Copy-Item `
              "${{ github.workspace }}\data\*" `
              "$stage\data\obs-plugins\obs-streamlink\" `
              -Recurse `
              -Force
          }

          @"
          OBS Streamlink
          ==============

          Built for OBS Studio 32.2.1
          Windows x64

          Close OBS completely before installing.

          Extract the contents of this ZIP into your OBS Studio
          installation directory.

          Main plugin:
            obs-plugins\64bit\obs-streamlink.dll

          "@ | Set-Content "$stage\INSTALL.txt"

          7z a `
            -tzip `
            "$zip" `
            "$stage\*"

          Write-Host ""
          Write-Host "PACKAGE:"
          Write-Host $zip

          7z l "$zip"


      # ============================================================
      # Upload artifact
      # ============================================================

      - name: Upload plugin package
        uses: actions/upload-artifact@v4
        with:
          name: obs-streamlink-obs32.2.1-windows-x64
          path: obs-streamlink-obs32.2.1-windows-x64.zip
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # GitHub release
      # ============================================================

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: obs-streamlink-obs32.2.1-windows-x64.zip
          generate_release_notes: true
