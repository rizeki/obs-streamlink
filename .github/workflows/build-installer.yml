name: Build OBS Streamlink

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  OBS_VERSION: 32.2.1
  OBS_DEPS_VERSION: 2026-07-15

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-2022

    steps:

      # ============================================================
      # Checkout obs-streamlink
      # ============================================================

      - name: Checkout obs-streamlink
        uses: actions/checkout@v5
        with:
          submodules: recursive


      # ============================================================
      # Checkout OBS Studio 32.2.1
      # ============================================================

      - name: Checkout OBS Studio
        uses: actions/checkout@v5
        with:
          repository: obsproject/obs-studio
          ref: 32.2.1
          path: obs-studio
          submodules: recursive


      # ============================================================
      # Install build tools
      # ============================================================

      - name: Install build tools
        shell: pwsh
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y --no-progress
          choco install 7zip -y --no-progress


      # ============================================================
      # Download OBS dependency package
      # ============================================================

      - name: Download OBS dependencies
        shell: pwsh
        run: |
          $url = "https://github.com/obsproject/obs-deps/releases/download/${{ env.OBS_DEPS_VERSION }}/windows-deps-${{ env.OBS_DEPS_VERSION }}-x64.zip"

          $zip  = "${{ github.workspace }}\obs-deps.zip"
          $deps = "${{ github.workspace }}\obs-deps"

          Write-Host "Downloading OBS dependencies:"
          Write-Host $url

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $zip

          if (-not (Test-Path $zip)) {
            throw "Failed to download OBS dependency archive."
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $deps | Out-Null

          7z x $zip "-o$deps" -y

          Write-Host ""
          Write-Host "OBS dependency tree:"
          Get-ChildItem $deps -Recurse -Force |
            Select-Object -First 200


      # ============================================================
      # Configure OBS
      #
      # We only need libobs and obs-frontend-api.
      # Do NOT install the OBS tree afterwards.
      # ============================================================

      - name: Configure OBS
        shell: pwsh
        run: |
          $obs  = "${{ github.workspace }}\obs-studio"
          $deps = "${{ github.workspace }}\obs-deps"
          $build = "$obs\build_x64"

          Write-Host "OBS source: $obs"
          Write-Host "OBS deps:   $deps"
          Write-Host "OBS build:  $build"

          cmake `
            -S "$obs" `
            -B "$build" `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_PREFIX_PATH="$deps" `
            -DENABLE_UI=OFF `
            -DENABLE_BROWSER=OFF `
            -DENABLE_PLUGINS=OFF `
            -DENABLE_SCRIPTING=OFF `
            -DENABLE_WEBSOCKET=OFF `
            -DENABLE_VIRTUALCAM=OFF `
            -DENABLE_NEW_MPEGTS_OUTPUT=OFF


      # ============================================================
      # Build OBS libraries
      # ============================================================

      - name: Build OBS libraries
        shell: pwsh
        run: |
          $build = "${{ github.workspace }}\obs-studio\build_x64"

          cmake `
            --build "$build" `
            --config Release `
            --parallel `
            --target libobs obs-frontend-api


      # ============================================================
      # Locate OBS development files
      # ============================================================

      - name: Locate OBS libraries
        shell: pwsh
        run: |
          $build = "${{ github.workspace }}\obs-studio\build_x64"

          Write-Host ""
          Write-Host "Searching for obs.lib..."

          $obsLib = Get-ChildItem `
            "$build" `
            -Recurse `
            -Filter "obs.lib" `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -match "\\Release\\"
            } |
            Select-Object -First 1

          if (-not $obsLib) {
            throw "obs.lib was not found."
          }

          Write-Host "obs.lib:"
          Write-Host $obsLib.FullName

          Write-Host ""
          Write-Host "Searching for obs-frontend-api.lib..."

          $frontendLib = Get-ChildItem `
            "$build" `
            -Recurse `
            -Filter "obs-frontend-api.lib" `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -match "\\Release\\"
            } |
            Select-Object -First 1

          if (-not $frontendLib) {
            throw "obs-frontend-api.lib was not found."
          }

          Write-Host "obs-frontend-api.lib:"
          Write-Host $frontendLib.FullName

          # Save paths for later steps.
          "OBS_LIB=$($obsLib.Directory.FullName)" >> $env:GITHUB_ENV
          "OBS_FRONTEND_LIB=$($frontendLib.Directory.FullName)" >> $env:GITHUB_ENV

          Write-Host ""
          Write-Host "OBS_LIB=$($obsLib.Directory.FullName)"
          Write-Host "OBS_FRONTEND_LIB=$($frontendLib.Directory.FullName)"


      # ============================================================
      # Build obs-streamlink
      #
      # Your FindFFmpeg.cmake already extracts the FFmpeg major
      # versions from version.h, so no FFmpeg version hardcoding is
      # required here.
      # ============================================================

      - name: Configure obs-streamlink
        shell: pwsh
        run: |
          $deps = "${{ github.workspace }}\obs-deps"
          $obs  = "${{ github.workspace }}\obs-studio"

          Write-Host "FFmpeg path:"
          Write-Host $deps

          Write-Host ""
          Write-Host "OBS library directory:"
          Write-Host $env:OBS_LIB

          Write-Host ""
          Write-Host "OBS frontend library directory:"
          Write-Host $env:OBS_FRONTEND_LIB

          cmake `
            -S . `
            -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DobsPath="$obs\build_x64" `
            -DFFMPEG_PATH="$deps" `
            -DCMAKE_PREFIX_PATH="$deps"


      # ============================================================
      # Build plugin
      # ============================================================

      - name: Build obs-streamlink
        shell: pwsh
        run: |
          cmake `
            --build build `
            --config Release `
            --parallel


      # ============================================================
      # Find resulting DLL
      # ============================================================

      - name: Verify plugin
        shell: pwsh
        run: |
          Write-Host "Searching for obs-streamlink.dll..."

          $dll = Get-ChildItem `
            "${{ github.workspace }}\build" `
            -Recurse `
            -Filter "obs-streamlink.dll" `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -match "\\Release\\"
            } |
            Select-Object -First 1

          if (-not $dll) {
            Write-Host ""
            Write-Host "Build directory:"
            Get-ChildItem `
              "${{ github.workspace }}\build" `
              -Recurse `
              -Force

            throw "obs-streamlink.dll was not produced."
          }

          Write-Host ""
          Write-Host "SUCCESS"
          Write-Host "Plugin:"
          Write-Host $dll.FullName

          "PLUGIN_DLL=$($dll.FullName)" >> $env:GITHUB_ENV


      # ============================================================
      # Package
      #
      # The ZIP mirrors the OBS installation directory.
      # ============================================================

      - name: Package plugin
        shell: pwsh
        run: |
          $stage = "${{ github.workspace }}\package"

          Remove-Item `
            $stage `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$stage\obs-plugins\64bit" |
            Out-Null

          Copy-Item `
            "$env:PLUGIN_DLL" `
            "$stage\obs-plugins\64bit\obs-streamlink.dll" `
            -Force

          # ----------------------------------------------------------
          # Copy plugin data
          # ----------------------------------------------------------

          if (Test-Path "${{ github.workspace }}\data") {

            New-Item `
              -ItemType Directory `
              -Force `
              -Path "$stage\data\obs-plugins\obs-streamlink" |
              Out-Null

            Copy-Item `
              "${{ github.workspace }}\data\*" `
              "$stage\data\obs-plugins\obs-streamlink\" `
              -Recurse `
              -Force
          }

          # ----------------------------------------------------------
          # Installation instructions
          # ----------------------------------------------------------

          @"
          OBS Streamlink
          ==============

          Built for:
            OBS Studio 32.2.1
            Windows x64

          Installation:
            1. Completely close OBS Studio.
            2. Extract this ZIP into your OBS Studio installation
               directory.
            3. Allow Windows to replace existing files if prompted.
            4. Start OBS Studio.

          The main plugin file is:

            obs-plugins\64bit\obs-streamlink.dll

          "@ | Set-Content "$stage\INSTALL.txt"

          # ----------------------------------------------------------
          # Create ZIP
          # ----------------------------------------------------------

          $zip = "${{ github.workspace }}\obs-streamlink-obs32.2.1-windows-x64.zip"

          Remove-Item `
            $zip `
            -Force `
            -ErrorAction SilentlyContinue

          7z a `
            -tzip `
            "$zip" `
            "$stage\*"

          if (-not (Test-Path $zip)) {
            throw "Failed to create package."
          }

          Write-Host ""
          Write-Host "PACKAGE CREATED:"
          Write-Host $zip

          Write-Host ""
          Write-Host "Package contents:"
          7z l "$zip"


      # ============================================================
      # Upload artifact
      # ============================================================

      - name: Upload plugin package
        uses: actions/upload-artifact@v4
        with:
          name: obs-streamlink-obs32.2.1-windows-x64
          path: obs-streamlink-obs32.2.1-windows-x64.zip
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # GitHub Release
      # ============================================================

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: obs-streamlink-obs32.2.1-windows-x64.zip
          generate_release_notes: true
