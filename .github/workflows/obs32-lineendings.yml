name: Normalize obs-streamlink source line endings

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  normalize:
    if: "!contains(github.event.head_commit.message, '[obs32-lineendings]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore CRLF line endings
        shell: python
        run: |
          from pathlib import Path
          p = Path('media-playback/media.cpp')
          data = p.read_bytes().replace(b'\r\n', b'\n').replace(b'\r', b'\n')
          p.write_bytes(data.replace(b'\n', b'\r\n'))
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/obs32-lineendings.yml
          git add media-playback/media.cpp
          git commit -m 'Preserve media.cpp line endings [obs32-lineendings]'
          git push
