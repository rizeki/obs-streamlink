name: Apply OBS 32.2.1 compatibility changes

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  update:
    if: "!contains(github.event.head_commit.message, '[obs32-update]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update source compatibility
        shell: python
        run: |
          from pathlib import Path

          p = Path('media-playback/media.cpp')
          s = p.read_text(encoding='utf-8')
          old = '''\tAVFrame *f = d->frame;\n\tint channels;\n\tif (avformat_version() < AV_VERSION_INT(59, 19, 100))\n\t\tchannels = f->channels;\n\telse\n\t    channels = f->ch_layout.nb_channels;'''
          new = '''\tAVFrame *f = d->frame;\n\tconst int channels = f->ch_layout.nb_channels;'''
          if old not in s:
              raise SystemExit('media.cpp target block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('obs-streamlink.cpp')
          s = p.read_text(encoding='utf-8')
          old = 'blog(LOG_ERROR, "[Streamlink Source] Failed to initialize streamlink source!! Python38 not found in plugin data path.");'
          new = 'blog(LOG_ERROR, "[Streamlink Source] Failed to initialize streamlink source!! %s not found in plugin data path.", obs_streamlink_python_ver);'
          if old in s:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/obs32-update.yml
          git add media-playback/media.cpp obs-streamlink.cpp
          git commit -m 'Complete OBS 32.2.1 source compatibility [obs32-update]'
          git push
